<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Climate Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-green-50 text-gray-800">
<header class="bg-green-600 text-white p-4 flex justify-between items-center shadow-md">
    <div>
        <h1 class="text-2xl font-bold">🌿 Climate Community</h1>
        <p class="text-xs mt-1">Acciones ambientales comunitarias</p>
    </div>
    <div id="userInfo" class="flex items-center gap-3">
        <span id="userName"></span>
        <button id="adminBtn" class="bg-yellow-500 px-3 py-1 rounded hover:bg-yellow-600 hidden text-sm font-bold">🛠️
            Admin
        </button>
        <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600 hidden">Salir</button>
    </div>
</header>

<main class="p-6">
    <div class="flex justify-center gap-2 mb-4">
        <input id="buscar" class="border p-2 rounded w-1/2" placeholder="Buscar acción o tipo...">
        <button onclick="buscar()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">🔍 Buscar
        </button>
    </div>

    <h2 class="text-xl font-semibold mb-2 text-center">📍 Mapa de Acciones Ambientales</h2>
    <div id="map" class="rounded-xl shadow-lg mb-6 mx-auto" style="height: 450px; width: 90%;"></div>

    <table class="w-11/12 mx-auto border-collapse bg-white shadow-md rounded-lg overflow-hidden">
        <thead class="bg-green-500 text-white">
        <tr>
            <th class="p-2">📛 Nombre</th>
            <th class="p-2">🏷️ Tipo</th>
            <th class="p-2">📍 Ubicación</th>
            <th class="p-2">👤 Responsable</th>
            <th class="p-2">✅ Resultados</th>
        </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
    </table>

    <section id="formSection" class="mt-10 hidden">
        <h2 class="text-xl font-semibold mb-4 text-center">➕ Agregar Nueva Acción Ambiental</h2>
        <form id="formulario"
              class="flex flex-wrap justify-center gap-3 bg-white p-4 rounded-lg shadow-md max-w-4xl mx-auto">
            <input type="text" id="nombre" placeholder="Nombre de la acción" required class="border p-2 rounded w-2/5">
            <input type="text" id="tipo" placeholder="Tipo (Reforestación, Educación...)" required
                   class="border p-2 rounded w-2/5">
            <input type="text" id="ubicacion" placeholder="Ubicación (Ciudad, Región)" required
                   class="border p-2 rounded w-2/5">
            <input type="text" id="responsable" placeholder="Responsable" class="border p-2 rounded w-2/5">
            <input type="text" id="resultados" placeholder="Resultados esperados" class="border p-2 rounded w-2/5">
            <input type="date" id="fecha_inicio" class="border p-2 rounded w-2/5">
            <input type="date" id="fecha_fin" class="border p-2 rounded w-2/5">

            <div class="w-full flex flex-wrap justify-center gap-3">
                <input type="file" id="foto" accept="image/*" class="border p-2 rounded w-2/5"
                       title="Foto de la acción">
                <p class="text-xs text-gray-600 w-2/5">📸 Foto opcional (máx 5MB)</p>
            </div>

            <input type="hidden" id="latitud">
            <input type="hidden" id="longitud">
            <p id="ubicacionInfo" class="w-full text-center text-xs text-blue-600">💡 Haz clic en el mapa para
                seleccionar ubicación</p>
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">➕ Agregar
                Acción
            </button>
        </form>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
