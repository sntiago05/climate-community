<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🔐 Iniciar Sesión - Climate Community</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 flex flex-col justify-center items-center min-h-screen">
<h1 class="text-3xl font-bold text-green-700 mb-6">🌿 Climate Community</h1>

<!-- Login -->
<div id="loginForm" class="bg-white p-6 rounded-lg shadow-md w-80">
    <h2 class="text-xl mb-4 font-semibold">Iniciar Sesión</h2>
    <input type="email" id="emailLogin" placeholder="Correo" class="border p-2 rounded w-full mb-3" required>
    <input type="password" id="passwordLogin" placeholder="Contraseña" class="border p-2 rounded w-full mb-4" required>
    <button id="btnLogin" class="bg-green-600 text-white w-full py-2 rounded hover:bg-green-700">Ingresar</button>
    <p class="mt-3 text-sm">¿No tienes cuenta?
        <a href="#" id="showRegister" class="text-green-600 font-semibold hover:underline">Regístrate</a>
    </p>
</div>

<!-- Register -->
<div id="registerForm" class="bg-white p-6 rounded-lg shadow-md w-80 hidden">
    <h2 class="text-xl mb-4 font-semibold">Crear Cuenta</h2>
    <input type="text" id="nombreReg" placeholder="Nombre" class="border p-2 rounded w-full mb-3" required>
    <input type="email" id="emailReg" placeholder="Correo" class="border p-2 rounded w-full mb-3" required>
    <input type="password" id="passwordReg" placeholder="Contraseña" class="border p-2 rounded w-full mb-4" required>
    <button id="btnRegister" class="bg-green-600 text-white w-full py-2 rounded hover:bg-green-700">Registrarse</button>
    <p class="mt-3 text-sm">¿Ya tienes cuenta?
        <a href="#" id="showLogin" class="text-green-600 font-semibold hover:underline">Inicia sesión</a>
    </p>
</div>

<script src="login.js"></script>
</body>
</html>
